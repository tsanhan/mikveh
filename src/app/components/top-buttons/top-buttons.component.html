<ion-fab [activated]="isShowApproaches()" [ngClass]="{'shita-main': true, open: isShowApproaches()}" slot="fixed"
  vertical="top" horizontal="start" (click)="toggle('main')">
  <ion-fab-button color="transparent" size="small">
    <ion-img src="assets/icon/shita.png"></ion-img>
  </ion-fab-button>
  <ion-fab-list side="bottom">
    <ion-fab-button class="active">
      <ion-text>
        אשכנז
      </ion-text>
    </ion-fab-button>
    <ion-fab-button>
      <ion-text>
        חב"ד
      </ion-text>
    </ion-fab-button>
    <ion-fab-button>
      <ion-text style="height: -webkit-fill-available;">
        עדות מזרח
      </ion-text>
    </ion-fab-button>
  </ion-fab-list>
</ion-fab>

<ion-fab *ngIf="isShowApproaches()" class="shita-alt" slot="fixed" vertical="top" horizontal="start"
  (click)="toggle('alt')">
  <ion-fab-button color="transparent" size="small">
    <ion-img src="assets/icon/ahita bachur.png"></ion-img>
  </ion-fab-button>
</ion-fab>

<ion-fab class="whatsapp" slot="fixed" vertical="top" horizontal="end">
  <ion-fab-button color="transparent" [href]="url" target="_blank" size="small">
    <ion-img src="assets/icon/watsapp.png"></ion-img>
  </ion-fab-button>
</ion-fab>
