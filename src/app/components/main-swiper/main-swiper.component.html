<swiper-container style="background: #F4D1CD; --swiper-navigation-color: #fff; --swiper-pagination-color: #fff" class="mySwiper"
  thumbs-swiper=".mySwiper2" space-between="10">
  @for(topic of topics(); track topic; let idx = $index) {
  <swiper-slide style="background: #F4D1CD;">
    <ion-card style="background: #F4D1CD;">
      <img class="img" [src]="'assets/images/srips/'+(idx+1)+'.png'" />
      <div class="card-header">
        <div [ngStyle]="{
          fontFamily: 'VarelaRound',
          textAlign: 'center',
          color: 'black',
          fontSize: '2rem'}"
          class="card-title">{{topic.title}}</div>
        <div [ngStyle]="{fontFamily: 'VarelaRound',
        textAlign: 'center',
        fontSize: '0.75rem',
        color: 'black'}" class="card-subtitle">{{topic.subtitle}}</div>
      </div>

      <div class="content" style="background: #F4D1CD;">
        @for(contentObj of topic.content[this.approachKey()]; track contentObj; let i = $index){
        <div>
          @if(contentObj.type === 'img') {
          <img [src]="contentObj.data" />
          }
          @else {
          {{contentObj.data}}
          }
        </div>
        }

      </div>
    </ion-card>
  </swiper-slide>
  }
</swiper-container>
