<ion-grid>
  <ion-row>
    <ion-col class="ion-text-center" size="4">
      <ng-icon name="tdesignSunRising" />
      {{sunrize() | date : 'HH:mm'}}
    </ion-col>
    <ion-col class="ion-text-center" size="4">{{debDate()}}</ion-col>
    <ion-col class="ion-text-center" size="4">
      <ng-icon name="tdesignSunFall" />
      {{sunset() | date : 'HH:mm'}}
    </ion-col>
  </ion-row>
</ion-grid>
