<div class="contant">
  <div class="buttons">
    <ion-button size="large" shape="round" color="light" (click)="page.set('time')" [ngStyle]="{'active': page() === 'time'}" >
      <ion-icon slot="icon-only" name="time-outline" />
    </ion-button>
    <ion-button size="large" shape="round" color="light" (click)="page.set('search')" [ngStyle]="{'active': page() === 'search'}">
      <ion-icon slot="icon-only" name="search-outline"></ion-icon>
    </ion-button>
    <ion-button size="large" shape="round" color="light" [href]="url" target="_blank">
      <ion-icon slot="icon-only" name="logo-whatsapp"></ion-icon>
    </ion-button>

    <!-- <ion-fab class="whatsapp" slot="fixed" vertical="top" horizontal="end">
      <ion-fab-button color="transparent" [href]="url" target="_blank" size="small">
        <ion-img src="assets/icon/watsapp.png"></ion-img>
      </ion-fab-button>
    </ion-fab>
     -->
  </div>
  <div class="data">
    @switch (page()){
      @case ('time') {
      <h1>Time</h1>
    } @case ('search') {
      <h1>Search</h1>
    } }
  </div>
</div>
