<div class="ion-datetime">

  <ion-datetime #myDatetime color="rose" [style]="{direction: 'ltr'}" locale="he-IL" presentation="date"
    (ionChange)="onDateChange($event)" [value]="israelTime" [highlightedDates]="highlightedDates$ | async">

  </ion-datetime>
  <ion-fab>
    <ion-fab-button size="small" id="open-add-event-modal">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</div>
<!-- {{selectedDateData$ | async | json}} -->

<br>
selectedDate {{selectedDate$ | async }}
<!--  -->


<ion-modal #modal trigger="open-add-event-modal">
  <ng-template>
    <ion-content>
      <ion-toolbar>
        <ion-title>{{selectedHDateHeb$ | async}} {{selectedDate$| async | date:'d לMMMM':'':'he'}}</ion-title>
      </ion-toolbar>
      <ion-list>
        <form [formGroup]="addEventForm" (ngSubmit)="onAddEvent(); modal.dismiss()">
          <ion-item>
            <ion-select formControlName="type" label="ראייה" label-placement="fixed" placeholder="מה ראיתי">
              <ion-select-option [value]="CalEventTypeEnum.SEE_BLOOD">דם</ion-select-option>
            </ion-select>
          </ion-item>

          <ion-item>
            <ion-radio-group formControlName="afterSunset" value="false">
              <ion-radio [value]="false">לפני שקיעה</ion-radio><br />
              <ion-radio [value]="true">אחרי שקיעה</ion-radio><br />
            </ion-radio-group>
          </ion-item>
          <ion-item>

            <ion-text>
              (<span>ב {{selectedDate$| async | date:'d לMMMM':'':'he'}}</span>
              <span> השקיעה היא ב{{sunsetForDate$ | async}}</span>)
            </ion-text>
          </ion-item>
          <ion-button type="submit" size="small">הוסיפי ראייה</ion-button>
        </form>
      </ion-list>
    </ion-content>
  </ng-template>
</ion-modal>
