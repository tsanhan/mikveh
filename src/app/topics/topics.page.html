<ion-grid [fixed]="true">
  <ion-row >
    <ion-col *ngFor="let topic of topics(); let i=index" [size]="6">
      <app-topic [topic]="topic"></app-topic>
    </ion-col>
  </ion-row>
</ion-grid>
<swiper-container>
  <swiper-slide>Slide 1</swiper-slide>
  <swiper-slide>Slide 2</swiper-slide>
  <swiper-slide>Slide 3</swiper-slide>
</swiper-container>
